<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二进制灯塔</title><style>
*{box-sizing:border-box}body{margin:0;background:#111f32;color:#eaf6ff;font-family:system-ui,sans-serif;min-height:100vh;padding:clamp(22px,5vw,60px)}main{max-width:880px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{color:#81bab9;font-size:12px;letter-spacing:3px}h1{font-size:clamp(30px,6vw,56px);font-weight:550;letter-spacing:-2px;margin:16px 0}p{color:#b0c4d8;line-height:1.9;font-size:15px}.value{font-size:clamp(56px,10vw,94px);font-variant-numeric:tabular-nums;font-weight:300;color:#b7ffe9;text-align:right}.value small{font-size:12px;display:block;color:#8faabc;letter-spacing:2px}.lamps{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(5px,1.6vw,14px);margin:35px 0}.lamp{background:#1c2e45;color:#83a6ba;border:1px solid #345064;border-radius:40px 40px 18px 18px;min-height:145px;padding:18px 5px;cursor:pointer;transition:background .3s,box-shadow .3s,transform .3s}.lamp span{display:block;width:26px;height:26px;border-radius:50%;background:#3d5264;margin:0 auto 22px;transition:background .3s,box-shadow .3s}.lamp strong{font-size:22px}.lamp small{display:block;font-size:11px;margin-top:9px}.lamp.on{background:#27554e;border-color:#8ce8cb;color:#d9fff2;box-shadow:0 0 30px #83e0bb15}.lamp.on span{background:#b1ffe2;box-shadow:0 0 28px #9effc9c2}.lamp:hover{transform:translateY(-4px)}button:focus-visible,input:focus-visible{outline:3px solid #c3ffed;outline-offset:4px}.equation{border-top:1px solid #344859;padding:24px 0;color:#bee7dd;min-height:80px;line-height:1.8;font-size:18px}input[type=range]{width:100%;accent-color:#97e7c6;margin:24px 0;height:30px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button.action{background:#21384a;border:1px solid #4a6876;border-radius:12px;color:#d8eee9;min-height:42px;padding:10px 18px;font-size:14px;cursor:pointer}.lesson{background:#1b2e40;border:1px solid #314e5e;border-radius:20px;padding:22px;margin-top:26px}.lesson h2{font-size:17px}.lesson p{font-size:14px;margin-bottom:0}.quiz{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.quiz input{width:110px;padding:11px;border-radius:10px;border:1px solid #426170;color:#efffff;background:#132636;font-size:15px}.quiz label{color:#b6d0d6;font-size:14px}#feedback{min-height:24px;color:#b9eadb}@media(max-width:520px){.lamp{min-height:120px}.lamp span{width:16px;height:16px}.lamp strong{font-size:17px}.lamp small{font-size:9px}header{align-items:flex-start}.value{font-size:54px;padding-top:28px}h1{letter-spacing:-1px}}@media(prefers-reduced-motion:reduce){.lamp,.lamp span{transition:none}.lamp:hover{transform:none}}
</style></head><body><main><header><div><span class="eyebrow">BIT BY BIT / 内置交互示例</span><h1>数字，亮起来。</h1><p>点亮一盏灯，就是一个 1。<br>八盏灯可以表示多少个不同的数？</p></div><div class="value"><output id="decimal">13</output><small>十进制数字</small></div></header><div class="lamps" id="lamps"></div><div class="equation" id="equation" aria-live="polite"></div><label for="slider">拖动数字，观察灯光如何变化</label><input id="slider" type="range" min="0" max="255" value="13"><div class="controls"><button class="action" id="play">▶ 自动计数</button><button class="action" id="step">前进一步 +1</button><button class="action" id="reset">重置为 0</button></div><section class="lesson"><h2>试着预测，再点亮验证。</h2><p>从右到左，每盏灯的权值翻倍：1、2、4、8……一个数等于所有亮灯权值的和。</p><div class="quiz"><label for="answer">只有权值 16、4、1 的灯亮着，结果是？</label><input type="number" min="0" max="255" id="answer" aria-label="填写预测的十进制数字"><button class="action" id="check">验证我的想法</button></div><p id="feedback" role="status"></p></section></main><script>
let number=13,timer=null;const powers=[128,64,32,16,8,4,2,1],lamps=document.getElementById('lamps'),slider=document.getElementById('slider');for(const p of powers){let b=document.createElement('button');b.className='lamp';b.innerHTML='<span></span><strong>0</strong><small>权值 '+p+'</small>';b.setAttribute('aria-label','切换权值 '+p+' 的灯');b.onclick=()=>{stop();number^=p;render()};lamps.append(b)}function render(){document.getElementById('decimal').textContent=number;slider.value=number;[...lamps.children].forEach((b,i)=>{const on=Boolean(number&powers[i]);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));b.querySelector('strong').textContent=on?'1':'0'});document.getElementById('equation').textContent=(powers.filter(p=>number&p).join(' + ')||'没有灯亮')+' = '+number+'　 ·　二进制 '+number.toString(2).padStart(8,'0')}function stop(){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 自动计数'}slider.oninput=()=>{stop();number=Number(slider.value);render()};document.getElementById('play').onclick=()=>{if(timer){stop();return}document.getElementById('play').textContent='Ⅱ 暂停';timer=setInterval(()=>{number=(number+1)%256;render()},900)};document.getElementById('step').onclick=()=>{stop();number=(number+1)%256;render()};document.getElementById('reset').onclick=()=>{stop();number=0;render()};document.getElementById('check').onclick=()=>{let v=document.getElementById('answer').value;document.getElementById('feedback').textContent=v===''?'先填一个你预测的数字。':Number(v)===21?'答对了！16 + 4 + 1 = 21。现在灯光也验证了你的想法。':'再把三盏灯的权值相加试试：16 + 4 + 1。';if(Number(v)===21&&v!==''){stop();number=21;render()}};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>
